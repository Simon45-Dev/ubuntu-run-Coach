name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ubuntu_run
          POSTGRES_PASSWORD: ubuntu_run
          POSTGRES_DB: ubuntu_run_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ubuntu_run"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ubuntu_run:ubuntu_run@localhost:5432/ubuntu_run_test
      CORS_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      JWT_REFRESH_TTL: 30d
      MFA_ENCRYPTION_KEY: ci-mfa-encryption-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npm run lint

      - run: npm run test

      - run: npm run test:e2e
