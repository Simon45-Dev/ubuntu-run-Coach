services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubuntu_run
      POSTGRES_PASSWORD: ubuntu_run
      POSTGRES_DB: ubuntu_run_dev
    ports:
      - "5432:5432"
    volumes:
      - ubuntu_run_postgres_data:/var/lib/postgresql/data

volumes:
  ubuntu_run_postgres_data:
